version: 2
updates:
  - package-ecosystem: pip
    directory: /python-pipeline
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # Upgrade NumPy's major version together with OpenCV and the Python runtime.
    ignore:
      - dependency-name: numpy
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
